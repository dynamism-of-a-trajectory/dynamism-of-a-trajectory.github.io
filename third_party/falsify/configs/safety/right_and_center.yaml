# Safety criteria for the RIGHT-AND-CENTER compositional task. Mirror
# of left_and_center.yaml — drone transits gate 1 (the original RIGHT
# gate) before gate 2 (the CENTER duplicate) counts.

bounds_frame: mocap
bounds_lower: [-1.0, -3.0, 0.2]
bounds_upper: [ 4.0,  3.0, 3.0]
max_speed: 10.0
max_tilt_rad: 1.2

drone_body:
  half_extents: [0.175, 0.175, 0.075]

collision:
  enabled: true
  gate_objects:  [gate]   # gate cloud = original-right ∪ center-copy
  other_objects: [table]

ordered_miss_gate:
  corners_frame: mocap
  gates:
    - name: gate_1   # original right gate — post centres from the gate Gaussians
      # (matches right_gate.yaml; the previous corners were a half-width box shifted
      # onto the west post — 2026-08-26 fix, caught in the cloud overlay)
      corners:  # re-measured 2026-09-25 from the gate cloud: posts' inner edges, top bar's underside
        - [0.182, -1.353, 0.2]
        - [0.916, -0.954, 0.2]
        - [0.916, -0.954, 1.877]
        - [0.182, -1.353, 1.877]
    - name: gate_2   # center copy
      corners:  # re-measured 2026-09-25 from the gate cloud: posts' inner edges, top bar's underside
        - [3.17, -0.26, 0.125]
        - [2.299, -0.259, 0.125]
        - [2.299, -0.259, 1.821]
        - [3.17, -0.26, 1.821]
  margin_m: 0.0
  goal_position: [1.525, -0.615, 1.0]
  # Box tolerance — unified with the single-gate scenes so GOAL_REACHED
  # fires under the same geometry (drone inside `goal ± half_extents`),
  # not the looser 1.5 m sphere that compositional originally used.
  goal_tolerance_half_extents: [0.3, 0.3, 0.5]
  goal_tolerance_m: 1.50            # legacy sphere — unused when box is set
  min_progress_window_s: 4.0
  min_progress_m: 0.05
  eval_stop_mode: true              # see configs/safety/left_and_center.yaml
